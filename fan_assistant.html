<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelty Hearts Fan Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            height: 90vh;
            display: flex;
            flex-direction: column;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 1.8em;
            margin-bottom: 5px;
        }

        header p {
            font-size: 0.95em;
            opacity: 0.9;
        }

        .chat-container {
            background: white;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            flex: 1;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            display: flex;
            gap: 12px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 8px;
            word-wrap: break-word;
            line-height: 1.5;
        }

        .message.assistant .message-content {
            background: #f0f0f0;
            color: #333;
        }

        .message.user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .message.assistant .avatar {
            background: #e0e0e0;
        }

        .message.user .avatar {
            background: rgba(255,255,255,0.2);
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #999;
            animation: bounce 1.4s infinite;
        }

        .dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {
            0%, 80%, 100% {
                opacity: 0.5;
                transform: translateY(0);
            }
            40% {
                opacity: 1;
                transform: translateY(-8px);
            }
        }

        .input-area {
            padding: 15px;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 24px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        input::placeholder {
            color: #999;
        }

        button {
            width: 44px;
            height: 44px;
            border: none;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: transform 0.2s;
        }

        button:hover {
            transform: scale(1.05);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: scale(1);
        }

        .welcome-message {
            text-align: center;
            color: #999;
            padding: 20px;
        }

        .welcome-message strong {
            color: #667eea;
        }

        .suggested-questions {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            padding: 0 20px 20px;
        }

        .suggested-btn {
            padding: 10px 16px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            color: #333;
            transition: all 0.2s;
            text-align: left;
        }

        .suggested-btn:hover {
            border-color: #667eea;
            background: #f9f9f9;
        }

        @media (max-width: 600px) {
            .container {
                max-width: 100%;
            }

            .message-content {
                max-width: 90%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚽ Kelty Hearts Fan Assistant</h1>
            <p>Ask us anything about the club</p>
        </header>

        <div class="chat-container">
            <div class="chat-messages" id="chatMessages">
                <div class="message assistant">
                    <div class="avatar">⚽</div>
                    <div class="message-content">
                        Hey there! 👋 Welcome to the Kelty Hearts Fan Assistant. I'm here to help answer your questions about match tickets, fixtures, the stadium, membership, and more. What would you like to know?
                    </div>
                </div>
            </div>

            <div class="suggested-questions" id="suggestedQuestions">
                <button class="suggested-btn" onclick="askQuestion('When is the next home game?')">When is the next home game?</button>
                <button class="suggested-btn" onclick="askQuestion('Where do I buy tickets?')">Where do I buy tickets?</button>
                <button class="suggested-btn" onclick="askQuestion('Can I bring my kids?')">Can I bring my kids?</button>
                <button class="suggested-btn" onclick="askQuestion('How do I become a member?')">How do I become a member?</button>
            </div>

            <div class="input-area">
                <input
                    type="text"
                    id="questionInput"
                    placeholder="Ask me anything..."
                    onkeypress="handleKeypress(event)"
                >
                <button onclick="sendQuestion()" id="sendBtn">↑</button>
            </div>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const questionInput = document.getElementById('questionInput');
        const sendBtn = document.getElementById('sendBtn');
        const suggestedQuestions = document.getElementById('suggestedQuestions');

        function handleKeypress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendQuestion();
            }
        }

        function askQuestion(question) {
            questionInput.value = question;
            sendQuestion();
        }

        async function sendQuestion() {
            const question = questionInput.value.trim();

            if (!question) return;

            // Add user message
            addMessage(question, 'user');
            questionInput.value = '';

            // Hide suggested questions
            suggestedQuestions.style.display = 'none';

            // Show typing indicator
            const typingIndicator = document.createElement('div');
            typingIndicator.className = 'message assistant';
            typingIndicator.innerHTML = `
                <div class="avatar">⚽</div>
                <div class="typing-indicator">
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
            `;
            chatMessages.appendChild(typingIndicator);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                const response = await fetch('/api/ask-question', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ question })
                });

                if (!response.ok) {
                    throw new Error('Failed to get answer');
                }

                const data = await response.json();

                // Remove typing indicator
                typingIndicator.remove();

                // Add assistant response
                addMessage(data.answer, 'assistant');

            } catch (error) {
                typingIndicator.remove();
                addMessage("Sorry, I had trouble understanding that. Try asking about tickets, fixtures, membership, or how to get to the stadium.", 'assistant');
            }
        }

        function addMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;

            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.textContent = sender === 'user' ? '👤' : '⚽';

            const content = document.createElement('div');
            content.className = 'message-content';
            content.textContent = text;

            messageDiv.appendChild(avatar);
            messageDiv.appendChild(content);
            chatMessages.appendChild(messageDiv);

            // Scroll to bottom
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // Focus input on load
        questionInput.focus();
    </script>
</body>
</html>
